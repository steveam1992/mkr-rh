name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: windows
          - os: macos-latest
            nombre: mac
          - os: ubuntu-latest
            nombre: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run package
        env:
          # Sin certificado de Apple: evita que electron-builder falle buscando uno.
          # La firma ad-hoc la pone el hook build/adhoc-sign.js; sin ella macOS se
          # niega a abrir la app en Apple Silicon (ver docs/INSTALACION-MACOS.md).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verificar que el .app quedo firmado
        if: matrix.nombre == 'mac'
        run: codesign --verify --deep --strict --verbose=2 dist/mac*/*.app

      - uses: actions/upload-artifact@v4
        with:
          name: mkr-rh-${{ matrix.nombre }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
